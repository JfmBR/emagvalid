# Banco local para desenvolvimento: npm run db:up
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: emagvalid
      POSTGRES_PASSWORD: emagvalid
      POSTGRES_DB: emagvalid
    ports:
      - '5432:5432'
    volumes:
      - dados-postgres:/var/lib/postgresql/data

volumes:
  dados-postgres:
