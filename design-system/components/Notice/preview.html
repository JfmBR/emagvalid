<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Notice</title>
  </head>
  <body style="padding: 24px">
    <div style="display: grid; gap: 16px">
      <div class="aviso" role="note">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <circle cx="10" cy="10" r="9" fill="none" stroke="var(--accent)" stroke-width="2" />
          <path
            d="M10 9v5M10 6v.5"
            stroke="var(--accent)"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <p><strong>A nota é um apoio à auditoria. Não é certificação de conformidade.</strong></p>
      </div>
      <div class="aviso alerta" role="status">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
          <path
            d="M10 2l9 16H1z"
            fill="none"
            stroke="var(--media)"
            stroke-width="2"
            stroke-linejoin="round"
          />
          <path
            d="M10 8v4M10 14.5v.5"
            stroke="var(--media)"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
        <p>
          <strong>2 orientações ainda sem revisão.</strong> Orientações sem revisão saem marcadas
          como “pendente” no relatório.
        </p>
      </div>
    </div>
  </body>
</html>
