<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Tabs</title>
  </head>
  <body style="padding: 24px">
    <div class="painel">
      <div role="tablist" aria-label="Tipo de verificação">
        <button type="button" role="tab" aria-selected="true">Falhas automáticas (10)</button
        ><button type="button" role="tab" aria-selected="false" tabindex="-1">
          Revisão humana (3)
        </button>
      </div>
      <div role="tabpanel">
        <p class="dica">A ferramenta não consegue julgar estes itens. Eles não entram na nota.</p>
      </div>
    </div>
  </body>
</html>
